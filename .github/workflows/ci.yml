name: AfyaPlus AI Capstone Verification Continuous Integration

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify-components:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Workspace Source
      uses: actions/checkout@v3

    - name: Set Up Python Environment Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Run Core Test Pyramid
      run: |
        python -m pip install pytest fastapi uvicorn httpx
        python -m pytest -v

    - name: Run Performance Metric Generation
      run: python scripts/measure_perf.py
