[pytest]
# Minimum version requirement to guarantee marker framework compatibility
minversion = 7.0

# Explicit paths to scan for automated test exploration loops
testpaths = tests

# Target filename processing structures for matching test modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Register test pyramid partition markers to block warning messages
markers =
    unit: Standard local validation stubs, credential routing components, and standalone execution blocks.
    integration: Multi-component system checks, full pipeline data loops, and synthetic data row tests.
    perf: Operational processing latency profiles, throughput metrics, and execution speed checks.

# Global test runtime execution rules and console formatting flags
addopts = 
    --strict-markers
    --tb=short
    -v

# Configure automated console logging formats for active runtime audits
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Suppress internal library deprecation warnings from cluttering clean grading logs
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
